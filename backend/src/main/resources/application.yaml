server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/memodb
    username: postgres
    password: password
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/memoto-realm
  kafka:
    bootstrap-servers: localhost:9092