<div class=" w-96 noise-background-wrapper">
  <svg
    class="noise-bg-svg"
    width="100%"
    height="100%"
    xmlns="http://www.w3.org/2000/svg"
    preserveAspectRatio="none">
    <filter [attr.id]="'bgnoise' + userColor()">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" result="noise" numOctaves="5"/>
      <feDiffuseLighting
        in="bgnoise"
        [attr.lighting-color]="userColor()"
        surfaceScale="2">
        <feDistantLight azimuth="45" elevation="60"/>
      </feDiffuseLighting>
    </filter>
    <rect x="0" y="0" width="100%" height="100%"
          [attr.filter]="'url(#bgnoise' + userColor() + ')'"
          fill="none"/>
  </svg>
  <div class="content w-96 mx-auto">
    <app-header></app-header>
    <app-menu [errorMessage]="errorMessage()"></app-menu>
    <app-filter (triggerAddForm)="activateAddForm()" (triggerMemoList)="activateMemoList()"></app-filter>
    <app-memo-add-memo [showAddMemoForm]="showAddMemoComponent()" (emitForm)="addMemo($event)"></app-memo-add-memo>
    <app-all-memos
      (emitMemoIdToDelete)="memoDeleteById($event)"
      (emitMemoId)="memoById($event)"
      [memosFromDB]="memosDto()"
    >
    </app-all-memos>
    <app-memo-item [memoFromBackend]="memo()"></app-memo-item>
    <app-footer></app-footer>



    <!-- Firefox und Vivaldi rendern anders. Chromium ist viel "sanfter". Man muss irgend eine Änderung am DOM erzwingen -->
    <label>
      Noise-Farbe wählen:
      <input
        type="color"
        [value]="userColor()"
        (input)="userColor.set($any($event.target).value)"
      />


    </label>
  </div>
</div>

<style>
  .noise-bg-svg {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    z-index: -1;
    pointer-events: none;
  }

  .noise-bg-svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  .content {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    overflow-y: auto;
    z-index: 1;
    pointer-events: auto;
  }

  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    overflow: hidden;
  }
</style>
<!--
  // all-memos
  [showAllMemos]="showAllMemoComponent()" und all-memos component
-->
